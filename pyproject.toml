[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mawshor"
version = "0.1.1"
description = "Arabic OCR pipeline built on OnnxTR with fine-tuned Arabic models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["arabic", "ocr", "onnx", "onnxtr", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "onnxtr>=0.8.1",
    "onnxruntime==1.26.0",
    "opencv-python-headless==4.13.0.92",
    "requests>=2.28",
]

[project.optional-dependencies]
gpu = ["onnxtr[gpu-headless]>=0.8.1", "onnxruntime-gpu==1.26.0"]

[project.scripts]
mawshor = "mawshor._cli:main"

[project.urls]
Homepage = "https://github.com/tarekio/mawshor"
Repository = "https://github.com/tarekio/mawshor"

[tool.hatch.build.targets.wheel]
packages = ["mawshor"]
